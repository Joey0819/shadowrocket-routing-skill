# MERGE REFERENCE ONLY. Do not replace an entire configuration with this fragment.
# Preserve listeners, subscriptions, selected exit, proxy groups, Hosts and rewrites.
# This file installs NO system firewall and NO node synchronization service.

[General]
# Replace matching existing keys; do not add duplicate keys.
dns-server = https://223.5.5.5/dns-query#no-h3
direct-dns-server = https://223.5.5.5/dns-query#no-h3
fallback-dns-server = https://doh.pub/dns-query#no-h3
